[package]
name = "ghostlink-host"
version = "0.1.0"
edition = "2021"

[dependencies]
methods = { path = "../methods" }
# 重新开启 docker feature
risc0-zkvm = { version = "3.0.0", features = ["docker"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"

[workspace]
members = [
    "host",
    "methods",
    "methods/guest",
]
resolver = "2"

[workspace.dependencies]
# 升级到 3.0.0
risc0-zkvm = { version = "3.0.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

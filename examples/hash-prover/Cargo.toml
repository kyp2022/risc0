[package]
name = "hash-prover"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["methods"]
exclude = ["methods/guest"]

[dependencies]
hash-prover-methods = { path = "methods" }
risc0-zkvm = { path = "../../risc0/zkvm" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
bincode = "1.3"
hex = "0.4"

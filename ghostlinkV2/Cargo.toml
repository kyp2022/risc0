[workspace]
members = [
    "host",
    "methods",
    "methods/guest",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# 使用 crates.io 预编译版本（与 ghostlink v1 一致）
# 预编译版本已包含 Metal kernels，无需本地构建
risc0-zkvm = { version = "3.0.0", default-features = false }
risc0-circuit-recursion = { version = "4.0.3", default-features = false }
risc0-circuit-keccak = { version = "4.0.3", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

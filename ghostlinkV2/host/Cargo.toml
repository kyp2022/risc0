[package]
name = "ghostlink-v2-host"
version.workspace = true
edition.workspace = true

[dependencies]
# Local methods crate
ghostlink-v2-methods = { path = "../methods" }

# RISC Zero zkVM host library
risc0-zkvm = { workspace = true, features = ["std", "prove", "client"] }
risc0-circuit-recursion = { workspace = true, features = ["prove"] }
risc0-circuit-keccak = { workspace = true, features = ["prove"] }

# Web framework
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
hex = "0.4"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"

# For signature verification on host side
alloy-primitives = "0.8"

[features]
default = []
prove = ["risc0-zkvm/prove", "risc0-circuit-recursion/prove", "risc0-circuit-keccak/prove"]
cuda = ["risc0-zkvm/cuda"]
